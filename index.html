<!DOCTYPE html>
<!-- iPhone のスクショを App Store の寸法に変換する（ブラウザ内で完結） -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shotfit — App Store screenshots</title>
<meta name="description" content="Any iPhone screenshot → 1320×2868. Runs in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230e0e10'/%3E%3Crect x='30' y='22' width='40' height='56' rx='8' fill='none' stroke='%23a855f7' stroke-width='6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e0e10; --panel:#16161a; --panel2:#1c1c21; --line:#2a2a31;
    --ink:#f2f2f5; --sub:#9a9aa4; --brand:#a855f7; --ok:#34d399; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Arial,sans-serif;
    padding:40px 20px;
  }
  .app{max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
  p.sub{margin:0 0 20px;color:var(--sub);font-size:14px}
  .drop{
    border:2px dashed var(--line);border-radius:16px;padding:36px 16px;text-align:center;
    background:var(--panel);cursor:pointer;transition:.15s;
  }
  .drop.hot{border-color:var(--brand);background:#1d1428}
  .drop strong{display:block;font-size:16px;margin-bottom:4px}
  .drop span{color:var(--sub);font-size:13px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .chip{
    border:1px solid var(--line);background:var(--panel2);color:var(--sub);
    padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;
  }
  .chip.on{border-color:var(--brand);color:var(--ink);background:#241636}
  .err{color:var(--warn);font-size:13px;white-space:pre-line}
  .results{display:grid;gap:8px;margin-top:14px}
  .card{
    display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:10px;
  }
  .card img{width:46px;border-radius:6px;background:#000}
  .meta{flex:1;min-width:0}
  .name{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .size{font-size:12px;color:var(--ok);margin-top:2px}
  .row{display:flex;gap:8px}
  .btn{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:7px 13px;border-radius:9px;font-size:12.5px;cursor:pointer;text-decoration:none;
  }
  .btn:hover{border-color:var(--brand)}
  .btn.main{background:var(--brand);border-color:transparent;color:#fff}
  .btn.ghost{color:var(--sub)}
  .btn:disabled{opacity:.4;cursor:default}
  .actions{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <h1>Shotfit</h1>
  <p class="sub">Any iPhone screenshot → 1320×2868. Nothing is uploaded.</p>

  <div class="drop" id="drop">
    <strong>Drop screenshots here</strong>
    <span>or click to choose · PNG / JPG · multiple OK</span>
    <input type="file" id="picker" accept="image/*" multiple hidden>
  </div>

  <div class="opts">
    <button class="chip on" data-size="69">6.9" · 1320×2868</button>
    <button class="chip" data-size="67">6.7" · 1290×2796</button>
    <button class="chip" data-size="65">6.5" · 1242×2688</button>
  </div>

  <div class="err" id="err"></div>
  <div class="results" id="results"></div>

  <div class="actions">
    <button class="btn main" id="downloadAll" disabled>Download all</button>
    <button class="btn ghost" id="clearAll" disabled>Clear</button>
  </div>
</div>

<script>
const SIZES = { "69":[1320,2868], "67":[1290,2796], "65":[1242,2688] };
const state = { sizes: new Set(["69"]) };
const results = [];

const drop = document.getElementById("drop");
const picker = document.getElementById("picker");
const resultsBox = document.getElementById("results");
const errBox = document.getElementById("err");
const downloadAllBtn = document.getElementById("downloadAll");
const clearAllBtn = document.getElementById("clearAll");

document.querySelectorAll("[data-size]").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.size;
    if (state.sizes.has(key)) {
      if (state.sizes.size === 1) return;
      state.sizes.delete(key); btn.classList.remove("on");
    } else {
      state.sizes.add(key); btn.classList.add("on");
    }
  });
});

drop.addEventListener("click", () => picker.click());
picker.addEventListener("change", () => handleFiles([...picker.files]));
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("hot"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("hot"); }));
drop.addEventListener("drop", e => handleFiles([...e.dataTransfer.files]));

/** 縦横比を保ったまま目標寸法へ。余りは端の色で埋める。 */
function convert(img, [tw, th]) {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (Math.abs((w / h) - (tw / th)) / (tw / th) > 0.10) return null;

  const canvas = document.createElement("canvas");
  canvas.width = tw; canvas.height = th;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";

  if (Math.round(w * (th / h)) >= tw) {
    const scale = th / h, sw = tw / scale;
    ctx.drawImage(img, (w - sw) / 2, 0, sw, h, 0, 0, tw, th);
  } else {
    const scale = tw / w, sh = th / scale;
    const c = document.createElement("canvas");
    c.width = c.height = 1;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
    const d = x.getImageData(0, 0, 1, 1).data;
    ctx.fillStyle = `rgb(${d[0]},${d[1]},${d[2]})`;
    ctx.fillRect(0, 0, tw, th);
    ctx.drawImage(img, 0, (h - sh) / 2, w, sh, 0, 0, tw, th);
  }
  return canvas;
}

async function handleFiles(files) {
  errBox.textContent = "";
  const images = files.filter(f => /^image\//.test(f.type));
  if (!images.length) { errBox.textContent = "No readable images in that drop."; return; }

  for (const file of images) {
    const img = await loadImage(file);
    if (!img) { addError(`${file.name}: can't read it (HEIC must be converted first).`); continue; }
    for (const key of [...state.sizes]) {
      const target = SIZES[key];
      const canvas = convert(img, target);
      if (!canvas) { addError(`${file.name}: not an iPhone aspect — skipped ${target[0]}×${target[1]}.`); continue; }
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      addResult(`${file.name.replace(/\.[^.]+$/, "")}-${target[0]}x${target[1]}.png`, blob, target);
    }
  }
}

function loadImage(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function addError(text) {
  errBox.textContent = errBox.textContent ? errBox.textContent + "\n" + text : text;
}

function addResult(name, blob, [tw, th]) {
  const url = URL.createObjectURL(blob);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${url}" alt="">
    <div class="meta">
      <div class="name">${name}</div>
      <div class="size">${tw} × ${th} · PNG · no alpha</div>
    </div>
    <div class="row">
      <a class="btn" href="${url}" download="${name}">Download</a>
      <button class="btn ghost" title="Remove">✕</button>
    </div>`;
  card.querySelector(".row .ghost").addEventListener("click", () => {
    URL.revokeObjectURL(url);
    card.remove();
    const i = results.findIndex(r => r.url === url);
    if (i >= 0) results.splice(i, 1);
    sync();
  });
  results.push({ name, url });
  resultsBox.appendChild(card);
  sync();
}

function sync() {
  downloadAllBtn.disabled = results.length === 0;
  clearAllBtn.disabled = results.length === 0;
}

downloadAllBtn.addEventListener("click", () => {
  results.forEach((r, i) => setTimeout(() => {
    const a = document.createElement("a");
    a.href = r.url; a.download = r.name; a.click();
  }, i * 200));
});

clearAllBtn.addEventListener("click", () => {
  results.forEach(r => URL.revokeObjectURL(r.url));
  results.length = 0;
  resultsBox.innerHTML = "";
  errBox.textContent = "";
  sync();
});
</script>
</body>
</html>
